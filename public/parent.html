<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="书写评价·家长端">
  <meta name="theme-color" content="#534AB7">
  <link rel="manifest" href="/manifest-parent.json">
  <link rel="apple-touch-icon" href="/icons/icon-parent-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-parent-192.png">
  <title>书写评价 · 家长端</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>window.APP_MODE = 'parent';</script>
</head>
<body>
  <div id="app">
    <!-- 家长登录页 -->
    <div id="page-login" class="page active">
      <div class="login-container">
        <div class="login-logo">
          <div class="logo-icon" style="background:linear-gradient(135deg,#7F77DD,#534AB7)">👨‍👩‍👧</div>
          <h1>书写评价 · 家长端</h1>
          <p>我是家长，全程追溯孩子的书写成长</p>
        </div>
        <div class="login-form">
          <div class="input-group">
            <input type="text" id="login-nickname" placeholder="请输入昵称" value="家长">
          </div>
          <button class="btn btn-primary btn-block" id="btn-login" style="background:linear-gradient(135deg,#7F77DD,#534AB7)">微信一键登录</button>
          <p class="login-tip">登录即代表同意《用户协议》和《隐私政策》</p>
        </div>
        <div class="login-features">
          <div class="feature-item"><span class="feature-icon">🔍</span><span>孩子记录100%追溯</span></div>
          <div class="feature-item"><span class="feature-icon">⭐</span><span>打分评语奖惩积分</span></div>
          <div class="feature-item"><span class="feature-icon">📊</span><span>成长趋势数据分析</span></div>
          <div class="feature-item"><span class="feature-icon">👶</span><span>注册孩子档案+学号</span></div>
        </div>
        <div style="text-align:center;padding:12px 0;font-size:12px;color:var(--text-4)">
          我是学生？请使用 <a href="/student.html" style="color:#534AB7">学生端App</a>
        </div>
      </div>
    </div>

    <!-- 主应用 -->
    <div id="main-app" class="main-app" style="display:none;">
      <!-- 顶部栏 -->
      <div class="app-header">
        <div class="header-left" id="header-child-switcher">
          <span class="child-avatar" id="current-child-avatar">👦</span>
          <span class="child-name" id="current-child-name">未选择</span>
          <span class="switch-icon">▼</span>
        </div>
        <div class="header-right">
          <span style="font-size:12px;font-weight:600;color:#534AB7;background:#EEEDFE;padding:4px 12px;border-radius:12px">家长端</span>
        </div>
      </div>

      <!-- 页面容器 -->
      <div class="page-container" id="page-container">
        <!-- 页面通过JS动态渲染 -->
      </div>

      <!-- 底部导航栏 -->
      <div class="tab-bar" id="tab-bar">
        <!-- 通过JS动态渲染 -->
      </div>
    </div>
  </div>

  <!-- 弹窗容器 -->
  <div id="modal-container"></div>

  <!-- 图片预览 -->
  <div id="image-preview" class="image-preview" style="display:none;">
    <div class="preview-close" onclick="closePreview()">✕</div>
    <img id="preview-img" src="" alt="预览">
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="toast"></div>

  <script src="/js/app.js"></script>
  <script>
    // 注册 Service Worker（PWA 安装支持）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
