# 云端构建 Android APK —— 无需本机安装 Java / Android SDK
# 把项目推送到 GitHub 后，Actions 会自动构建并生成可下载的 app-debug.apk
name: Build Android APK

on:
  workflow_dispatch: {}   # 手动触发：仓库 → Actions → Build Android APK → Run workflow
  push:
    branches: [ main, master ]
    paths:
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 同步 Web 资源到 Android 工程
        run: npx cap sync android

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: 接受 SDK 许可
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: handwriting-eval-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
