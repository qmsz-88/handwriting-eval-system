# 云端构建 Android APK —— 学生端 + 家长端双包
# 两个包使用不同 applicationId，可在同一手机共存安装
name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android 图标/启动屏/双端 flavor 资源已本地生成并提交到仓库（避免 CI 无中文字体降级）

      - name: 安装依赖
        run: npm install

      - name: 同步 Web 资源到 Android 工程
        run: npx cap sync android || true

      - name: 安装 Android SDK 组件并接受许可
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools" || true

      - name: 构建学生端 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "window.APP_VARIANT = 'student';" > app/src/main/assets/public/variant.js
          ./gradlew assembleStudentDebug --no-daemon

      - name: 构建家长端 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          echo "window.APP_VARIANT = 'parent';" > app/src/main/assets/public/variant.js
          ./gradlew assembleParentDebug --no-daemon

      - name: 上传学生端 APK
        uses: actions/upload-artifact@v4
        with:
          name: handwriting-eval-student-apk
          path: android/app/build/outputs/apk/student/debug/app-student-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 上传家长端 APK
        uses: actions/upload-artifact@v4
        with:
          name: handwriting-eval-parent-apk
          path: android/app/build/outputs/apk/parent/debug/app-parent-debug.apk
          if-no-files-found: error
          retention-days: 30
