# 云端构建 Android APK —— 无需本机安装 Java / Android SDK
# 推送到 GitHub 后 Actions 自动构建，生成可下载的 app-debug.apk
name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android 图标/启动屏已本地生成并提交到仓库（避免 CI 无中文字体降级）

      - name: 安装依赖
        run: npm install

      - name: 同步 Web 资源到 Android 工程
        run: npx cap sync android || true

      - name: 安装 Android SDK 组件并接受许可
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools" || true

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: handwriting-eval-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
